name: Deploy to Render

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (web)
        env:
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_WEB" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_WEB"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_WEB"

      - name: Trigger Render deploy (api)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_API"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_API"
